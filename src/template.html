<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>99password · 确定性密码生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f6fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
.container{background:#fff;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,0.08);width:100%;max-width:420px;overflow:hidden;border:1px solid #e8ecf1}
.header{background:#2c3e50;padding:32px 24px 28px;text-align:center}
.logo{font-size:32px;font-weight:700;color:#fff;letter-spacing:1px;font-family:"SF Mono","Fira Code","Consolas","Courier New",monospace}
.logo-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px;letter-spacing:0.5px}
.form{padding:28px 24px 20px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:600}
.field input{width:100%;height:46px;border:1px solid #dcdfe6;border-radius:8px;padding:0 14px;font-size:15px;outline:none;transition:border-color .2s;background:#fff}
.field input:focus{border-color:#2c3e50}
.field input::placeholder{color:#c0c4cc}
.result-area{padding:0 24px 20px}
.result-box{background:#fafbfc;border:1px solid #e8ecf1;border-radius:10px;padding:14px 16px;min-height:56px;display:none;align-items:center;gap:10px}
.result-box.show{display:flex}
.result-box .pwd{flex:1;font-family:"SF Mono","Fira Code","Consolas","Courier New",monospace;font-size:16px;color:#2c3e50;word-break:break-all;line-height:1.5}
.result-box .pwd.masked{color:#aaa}
.result-box .pwd.loading{color:#3498db;font-size:13px;font-style:normal}
.btn-group{display:flex;gap:6px;flex-shrink:0}
.btn-icon{width:36px;height:36px;border:1px solid #dcdfe6;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff}
.btn-icon:active{transform:scale(0.95)}
.btn-eye{color:#555}
.btn-eye:hover{border-color:#2c3e50;color:#2c3e50}
.btn-copy{background:#2c3e50;color:#fff;border-color:#2c3e50}
.btn-copy:hover{background:#34495e}
.btn-copy.copied{background:#27ae60;border-color:#27ae60}
.btn-icon svg{width:18px;height:18px;fill:currentColor}
.btn-icon:disabled{opacity:.35;cursor:not-allowed}
.links{padding:0 24px 24px;text-align:center}
.links a{font-size:12px;color:#95a5a6;text-decoration:none;margin:0 8px}
.links a:hover{color:#2c3e50;text-decoration:underline}
.footer{text-align:center;padding:18px;font-size:11px;color:#bdc3c7;line-height:1.8}
.footer a{color:#95a5a6;text-decoration:none}
.footer a:hover{color:#2c3e50;text-decoration:underline}
@media(max-width:360px){
  .header{padding:24px 16px 22px}
  .logo{font-size:28px}
  .form{padding:20px 16px 16px}
  .result-area{padding:0 16px 16px}
  .result-box .pwd{font-size:14px}
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">99password</div>
    <div class="logo-sub">Deterministic Password Generator</div>
  </div>
  <div class="form">
    <div class="field">
      <label>主密码</label>
      <input id="masterPwd" type="password" placeholder="只有你知道的主密码" autocomplete="off">
    </div>
    <div class="field">
      <label>站点标识</label>
      <input id="siteKey" type="text" placeholder="如 taobao、github、qq" autocomplete="off">
    </div>
  </div>
  <div class="result-area">
    <div class="result-box" id="resultBox">
      <span class="pwd masked" id="pwdText">输入主密码和站点标识</span>
      <div class="btn-group">
        <button class="btn-icon btn-eye" id="btnEye" title="显示/隐藏" disabled>
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
        <button class="btn-icon btn-copy" id="btnCopy" title="复制" disabled>
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="links">
    <a href="/about">加密原理</a>
    <a href="/about#advantages">为什么选它</a>
    <a href="/v1">v1 旧版</a>
  </div>
</div>

<div class="footer">
  <p>Copyright © 2026 99password · <a href="https://flowerpassword.com" target="_blank">致敬花密 FlowerPassword</a></p>
  <p>Hosted by <a href="https://www.cloudflare.com" target="_blank">Cloudflare Pages</a></p>
</div>

<!-- ============ 内联 hash-wasm（含 WASM base64） ============ -->
<script>/*__HASH_WASM_INLINE__*/</script>

<!-- ============ 主逻辑 ============ -->
<script>
var ARGON2_CONFIG = { iterations: 3, memorySize: 65536, parallelism: 1, hashLength: 32 };
var OUTPUT_LENGTH = 20;
var SALT_PREFIX = 'flowerpassword-v2:';
var CHARSET = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';

var masterInput = document.getElementById('masterPwd');
var siteInput = document.getElementById('siteKey');
var resultBox = document.getElementById('resultBox');
var pwdText = document.getElementById('pwdText');
var btnEye = document.getElementById('btnEye');
var btnCopy = document.getElementById('btnCopy');
var eyeIcon = document.getElementById('eyeIcon');

var passwordVisible = false;
var currentPassword = '';
var deriveToken = 0;
var debounceTimer = null;

var EYE_OPEN = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
var EYE_CLOSED = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';

function bytesToPassword(bytes, length) {
  var out = '';
  var max = 256 - (256 % CHARSET.length);
  var i = 0, guard = 0;
  while (out.length < length && guard < 100000) {
    guard++;
    var b = bytes[i % bytes.length];
    i++;
    if (b < max) out += CHARSET[b % CHARSET.length];
  }
  return out;
}

async function deriveArgon2id(masterPwd, siteKey) {
  if (typeof hashwasm === 'undefined' || !hashwasm.argon2id) throw new Error('hash-wasm 未加载');
  var hash = await hashwasm.argon2id({
    password: masterPwd,
    salt: SALT_PREFIX + siteKey,
    parallelism: ARGON2_CONFIG.parallelism,
    iterations: ARGON2_CONFIG.iterations,
    memorySize: ARGON2_CONFIG.memorySize,
    hashLength: ARGON2_CONFIG.hashLength,
    outputType: 'binary'
  });
  return bytesToPassword(hash, OUTPUT_LENGTH);
}

function maskPassword(pwd) {
  if (pwd.length <= 4) return '\u2022'.repeat(pwd.length);
  return pwd.substring(0, 3) + '\u2022'.repeat(pwd.length - 6) + pwd.substring(pwd.length - 3);
}

function setLoading() {
  resultBox.classList.add('show');
  pwdText.textContent = '计算中…';
  pwdText.classList.add('loading');
  pwdText.classList.remove('masked');
  btnEye.disabled = true;
  btnCopy.disabled = true;
}

function setResult(pwd) {
  currentPassword = pwd;
  pwdText.classList.remove('loading');
  if (passwordVisible) {
    pwdText.textContent = pwd;
    pwdText.classList.remove('masked');
  } else {
    pwdText.textContent = maskPassword(pwd);
    pwdText.classList.add('masked');
  }
  btnEye.disabled = false;
  btnCopy.disabled = false;
}

function clearResult() {
  currentPassword = '';
  resultBox.classList.remove('show');
  btnEye.disabled = true;
  btnCopy.disabled = true;
}

async function updatePassword() {
  var m = masterInput.value, k = siteInput.value;
  if (!m || !k) { clearResult(); return; }
  var token = ++deriveToken;
  setLoading();
  try {
    var pwd = await deriveArgon2id(m, k);
    if (token !== deriveToken) return;
    setResult(pwd);
  } catch (e) {
    if (token !== deriveToken) return;
    pwdText.textContent = '计算失败：' + e.message;
    pwdText.classList.add('loading');
  }
}

function scheduleUpdate() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updatePassword, 250);
}

masterInput.addEventListener('input', scheduleUpdate);
siteInput.addEventListener('input', scheduleUpdate);

btnEye.addEventListener('click', function() {
  passwordVisible = !passwordVisible;
  if (passwordVisible) {
    eyeIcon.innerHTML = EYE_CLOSED;
    if (currentPassword) { pwdText.textContent = currentPassword; pwdText.classList.remove('masked'); }
  } else {
    eyeIcon.innerHTML = EYE_OPEN;
    if (currentPassword) { pwdText.textContent = maskPassword(currentPassword); pwdText.classList.add('masked'); }
  }
});

btnCopy.addEventListener('click', function() {
  if (!currentPassword) return;
  navigator.clipboard.writeText(currentPassword).then(function() {
    btnCopy.classList.add('copied');
    btnCopy.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
    setTimeout(function() {
      btnCopy.classList.remove('copied');
      btnCopy.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
      setTimeout(function() { navigator.clipboard.writeText('').catch(function(){}); }, 15000);
    }, 1500);
  });
});

window.addEventListener('load', function() {
  if (typeof hashwasm === 'undefined') {
    resultBox.classList.add('show');
    pwdText.textContent = '库加载失败';
    pwdText.classList.add('loading');
  }
});
</script>
</body>
</html>
